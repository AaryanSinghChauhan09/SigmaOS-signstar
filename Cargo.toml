[package]
name = "sigmaos-signstar"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "SigmaOS signstar component — Signstar secure-enclave signing protocol (archlinux/signstar inspired)"

[lib]
name = "signstar"
path = "src/lib.rs"

[dependencies]
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
semver = { version = "1", features = ["serde"] }
base64 = "0.22"
rand = "0.9"

[dev-dependencies]
tempfile = "3"
